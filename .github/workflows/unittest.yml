name: Test

on: [push, pull_request]

jobs:
  fetch-deps:
    name: Prepare sample binary files
    uses: ./.github/workflows/binfiles.yml

  test:
    name: '${{ matrix.platform.name }} ${{ matrix.python-version }}'
    runs-on: ${{ matrix.platform.os }}
    needs: fetch-deps

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - { name: 'Windows', os: 'windows-latest' }
          - { name: 'Linux',   os: 'ubuntu-latest' }

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restore sample binaries
      id: cache
      uses: actions/cache/restore@v6
      with:
        enableCrossOsArchive: true
        path: binfiles
        key: binfiles

    - name: Install python libraries
      shell: bash
      run: |
        uv sync --locked --python "${{ matrix.python-version }}" --group dev

    - name: Run unit tests
      shell: bash
      run: |
        uv run --locked --python "${{ matrix.python-version }}" --group dev pytest . --binfiles=binfiles --require-binfiles