name: Test with Ghidra

on: [push, pull_request]

jobs:
  test:
    name: 'Ghidra integration tests'
    runs-on: 'ubuntu-latest'

    container:
      # Note: This version should be kept in sync with the type stubs in /pyproject.toml
      image: blacktop/ghidra:12.1.4
      env:
        # not set by default for some reason
        GHIDRA_INSTALL_DIR: '/ghidra'

    steps:
    - uses: actions/checkout@v7

    # We cannot reuse the fetch-deps step from the other unit tests because the cache is not shared if different
    # container images are used, see https://github.com/actions/cache/issues/1361#issuecomment-2611294058
    - name: Restore original binaries
      id: cache
      uses: actions/cache@v6
      with:
        path: binfiles
        key: legobin

    - name: Download original island binaries
      if: ${{ !steps.cache.outputs.cache-hit }}
      run: |
        wget https://legoisland.org/download/ISLE.EXE --directory-prefix=binfiles

    - name: Verify files
      run: |
        echo "5cf57c284973fce9d14f5677a2e4435fd989c5e938970764d00c8932ed5128ca binfiles/ISLE.EXE" | sha256sum --check

    - name: Install python
      shell: bash
      run: |
        apt-get update
        apt-get -y install python3 python3-dev build-essential git

    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - name: Install pinned dependencies
      run: uv sync --locked --group dev

    - name: Build pinned native inline fixes
      shell: bash
      run: |
        set -euo pipefail
        revision=78cca264d0daa7d3827db10cfa1150fc7cfced67
        installer="$RUNNER_TEMP/buildPatchedDecompiler.sh"
        curl --fail --location --retry 3 --output "$installer" \
          "https://raw.githubusercontent.com/agluszak/ghidra/$revision/support/buildPatchedDecompiler.sh"
        bash "$installer" "$GHIDRA_INSTALL_DIR" "$revision"

    - name: Run unit tests
      shell: bash
      run: |
        uv run --locked --group dev pytest . --binfiles=binfiles --require-ghidra
