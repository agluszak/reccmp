name: Test with Ghidra

on: [push, pull_request]

jobs:
  test:
    name: 'Ghidra integration tests'
    runs-on: 'ubuntu-latest'

    env:
      GHIDRA_INSTALL_DIR: /tmp/reccmp-ghidra

    steps:
    - uses: actions/checkout@v7

    # We cannot reuse the fetch-deps step from the other unit tests because the cache is not shared if different
    # container images are used, see https://github.com/actions/cache/issues/1361#issuecomment-2611294058
    - name: Restore original binaries
      id: cache
      uses: actions/cache@v6
      with:
        path: binfiles
        key: legobin

    - name: Download original island binaries
      if: ${{ !steps.cache.outputs.cache-hit }}
      run: |
        wget https://legoisland.org/download/ISLE.EXE --directory-prefix=binfiles

    - name: Verify files
      run: |
        echo "5cf57c284973fce9d14f5677a2e4435fd989c5e938970764d00c8932ed5128ca binfiles/ISLE.EXE" | sha256sum --check

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'

    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - name: Install pinned dependencies
      run: uv sync --locked --group dev

    - name: Install pinned fork distribution
      shell: bash
      run: |
        set -euo pipefail
        revision=b70a9208273905cb642f3d296a4e54d6f7fe7e83
        installer="$RUNNER_TEMP/installForkDistribution.sh"
        curl --fail --location --retry 3 --output "$installer" \
          "https://raw.githubusercontent.com/agluszak/ghidra/$revision/support/installForkDistribution.sh"
        bash "$installer" "$revision" 484764aa7a41c9b84e98f740eb5b50c6444307e23290a6e0337b27dca131b31b "$GHIDRA_INSTALL_DIR"

    - name: Run unit tests
      shell: bash
      run: |
        uv run --locked --group dev pytest . --binfiles=binfiles --require-ghidra
