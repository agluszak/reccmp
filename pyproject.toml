[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "reccmp"
description = "Collection of decompilation tools."
readme = "docs/intro.md"
license = "AGPL-3.0-or-later"
license-files = ["COPYING", "reccmp/bin/LICENSE*.txt"]
dynamic = ["version"]
requires-python = ">= 3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "capstone==5.0.9",
  "colorama>=0.4.6",
  "pydantic==2.13.5",
  "ruamel.yaml==0.19.1",
  "pydemumble==0.0.1",
  "pyghidra @ https://github.com/agluszak/ghidra/releases/download/wizardry-cfd01e0128630ae9d162009ec7af402fe57bced2/pyghidra-3.3.0-py3-none-any.whl",
  "ghidriff @ https://github.com/agluszak/ghidriff/archive/a1ddd07630bfb4ac9b56057a24808e92acc6ab97.tar.gz",
]

[project.scripts]
reccmp-cvdump = "reccmp.tools.cvdump:main"
reccmp-datacmp = "reccmp.tools.datacmp:main"
reccmp-decomplint = "reccmp.tools.decomplint:main"
reccmp-project = "reccmp.tools.project:main"
reccmp-reccmp = "reccmp.tools.compare:main"
reccmp-roadmap = "reccmp.tools.roadmap:main"
reccmp-verexp = "reccmp.tools.verexp:main"
reccmp-vtable = "reccmp.tools.vtable:main"
reccmp-ghidra-import = "reccmp.ghidra.ghidra_import:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "black==26.5.1",
  "codespell==2.4.3",
  "pylint==4.0.8",
  "mypy==2.3.1",
  "types-colorama>=0.4.15.20260508",
  "ghidra-stubs @ https://github.com/agluszak/ghidra/releases/download/wizardry-cfd01e0128630ae9d162009ec7af402fe57bced2/ghidra_stubs-12.3-py3-none-any.whl",
]

[tool.setuptools.dynamic]
version = { attr = "reccmp.VERSION" }

[tool.setuptools.packages.find]
include = ["reccmp*"]

[flake8]
max-line-length = 120


[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
# The default `.pytest_cache` path is rejected by Ghidra 12.1.
cache_dir="pytest_cache"
xfail_strict=true
[[tool.mypy.overrides]]
# Ghidriff and JPype ship without type information.
module = ["ghidriff", "ghidriff.*", "jpype"]
ignore_missing_imports = true
